<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Sign In — SkillVerify</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="css/style.css"/>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"/>
</head>
<body class="auth-page">

  <div class="auth-card">

    <div class="auth-logo">
      <div class="auth-logo-mark">
        <i class="fas fa-check-double"></i>
      </div>
      <h1>SkillVerify</h1>
      <p>Healthcare Skill Assessment Platform</p>
    </div>

    <form id="login-form">
      <div class="form-group">
        <label class="form-label">Email Address</label>
        <div style="position:relative">
          <i class="fas fa-envelope" style="position:absolute;left:12px;top:50%;
            transform:translateY(-50%);color:var(--text-4);font-size:0.85rem;pointer-events:none"></i>
          <input type="email" id="input-email" class="form-input"
            placeholder="you@company.com" required autocomplete="email"
            style="padding-left:2.25rem"/>
        </div>
      </div>

      <div class="form-group">
        <label class="form-label">Password</label>
        <div style="position:relative">
          <i class="fas fa-lock" style="position:absolute;left:12px;top:50%;
            transform:translateY(-50%);color:var(--text-4);font-size:0.85rem;pointer-events:none"></i>
          <input type="password" id="input-password" class="form-input"
            placeholder="••••••••" required autocomplete="current-password"
            style="padding-left:2.25rem;padding-right:2.75rem"/>
          <button type="button" id="toggle-password" tabindex="-1"
            style="position:absolute;right:12px;top:50%;transform:translateY(-50%);
              background:none;border:none;color:var(--text-3);cursor:pointer;font-size:0.875rem">
            <i class="fas fa-eye"></i>
          </button>
        </div>
      </div>

      <div id="error-box" class="danger-box hidden"
        style="margin-bottom:1rem;display:flex;align-items:center;gap:8px">
        <i class="fas fa-exclamation-circle" style="flex-shrink:0"></i>
        <span id="error-text"></span>
      </div>

      <button type="submit" class="btn btn-primary btn-full btn-lg" id="login-btn">
        <i class="fas fa-arrow-right-to-bracket"></i> Sign In
      </button>
    </form>

    <div class="auth-divider">or</div>

    <div class="auth-footer">
      Don't have an account? <a href="signup.html">Create one free</a>
    </div>
  </div>

  <div id="toast-container"></div>

  <script type="module">
    import { auth, db, signInWithEmailAndPassword, getDoc, doc, SUPER_ADMIN_EMAIL } from './js/app.js';

    document.getElementById('toggle-password').addEventListener('click', () => {
      const input = document.getElementById('input-password');
      const icon  = document.querySelector('#toggle-password i');
      input.type        = input.type === 'password' ? 'text' : 'password';
      icon.className    = input.type === 'password' ? 'fas fa-eye' : 'fas fa-eye-slash';
    });

    document.getElementById('login-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const email    = document.getElementById('input-email').value.trim();
      const password = document.getElementById('input-password').value;
      const btn      = document.getElementById('login-btn');
      const errorBox = document.getElementById('error-box');
      const errorTxt = document.getElementById('error-text');

      errorBox.classList.add('hidden');
      btn.disabled  = true;
      btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Signing in...';

      try {
        const cred = await signInWithEmailAndPassword(auth, email, password);
        await redirectUser(cred.user);
      } catch (err) {
        btn.disabled  = false;
        btn.innerHTML = '<i class="fas fa-arrow-right-to-bracket"></i> Sign In';
        errorBox.classList.remove('hidden');
        switch (err.code) {
          case 'auth/invalid-credential':
          case 'auth/wrong-password':
          case 'auth/user-not-found':
          case 'auth/invalid-email':
            errorTxt.textContent = 'Invalid email or password. Please try again.'; break;
          case 'auth/too-many-requests':
            errorTxt.textContent = 'Too many failed attempts. Try again later.'; break;
          case 'auth/network-request-failed':
            errorTxt.textContent = 'Network error. Check your connection.'; break;
          default:
            errorTxt.textContent = 'Login failed. Please try again.';
        }
        document.querySelector('.auth-card').style.animation = 'shake 0.4s ease';
        setTimeout(() => document.querySelector('.auth-card').style.animation = '', 400);
      }
    });

    async function redirectUser(user) {
      try {
        if (user.email === SUPER_ADMIN_EMAIL) { window.location.href = 'admin.html'; return; }
        const snap = await getDoc(doc(db, 'settings', 'superAdmins'));
        if (snap.exists() && (snap.data().emails||[]).includes(user.email)) {
          window.location.href = 'admin.html'; return;
        }
        window.location.href = 'recruiter.html';
      } catch (e) { window.location.href = 'recruiter.html'; }
    }
  </script>
</body>
</html>
