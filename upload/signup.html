<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Sign Up — SkillVerify</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="css/style.css"/>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"/>
</head>
<body class="auth-page">

  <div class="auth-card" style="max-width:480px">
    <div class="auth-logo">
      <div class="auth-logo-mark"><i class="fas fa-check-double"></i></div>
      <h1>SkillVerify</h1>
      <p>Start your free trial — no credit card required</p>
    </div>

    <div style="display:flex;align-items:center;gap:10px;background:var(--primary-light);
      border:1px solid var(--primary-mid);border-radius:var(--radius-md);
      padding:0.875rem 1rem;margin-bottom:1.5rem">
      <div style="width:36px;height:36px;background:var(--primary);border-radius:var(--radius-sm);
        display:flex;align-items:center;justify-content:center;flex-shrink:0">
        <i class="fas fa-gift" style="color:#fff;font-size:0.9rem"></i>
      </div>
      <div>
        <div style="font-size:0.85rem;font-weight:700;color:var(--primary-dark)">5 free assessments included</div>
        <div style="font-size:0.75rem;color:var(--primary-dark);opacity:0.8;margin-top:1px">No payment needed to get started</div>
      </div>
    </div>

    <form id="signup-form">
      <div class="form-group">
        <label class="form-label">Company Name <span class="req">*</span></label>
        <input type="text" id="input-company" class="form-input"
          placeholder="e.g. Med Ninjas Staffing" required autocomplete="organization"/>
      </div>
      <div class="form-group">
        <label class="form-label">Your Full Name <span class="req">*</span></label>
        <input type="text" id="input-name" class="form-input"
          placeholder="Jane Smith" required autocomplete="name"/>
      </div>
      <div class="form-group">
        <label class="form-label">Work Email <span class="req">*</span></label>
        <input type="email" id="input-email" class="form-input"
          placeholder="you@company.com" required autocomplete="email"/>
      </div>
      <div class="form-group">
        <label class="form-label">Password <span class="req">*</span></label>
        <div style="position:relative">
          <input type="password" id="input-password" class="form-input"
            placeholder="At least 8 characters" required minlength="8"
            autocomplete="new-password" style="padding-right:2.75rem"/>
          <button type="button" id="toggle-password" tabindex="-1"
            style="position:absolute;right:12px;top:50%;transform:translateY(-50%);
              background:none;border:none;color:var(--text-3);cursor:pointer;font-size:0.875rem">
            <i class="fas fa-eye"></i>
          </button>
        </div>
        <div style="display:flex;gap:4px;margin-top:8px">
          <div id="bar-1" style="flex:1;height:3px;border-radius:2px;background:var(--border);transition:background 0.2s"></div>
          <div id="bar-2" style="flex:1;height:3px;border-radius:2px;background:var(--border);transition:background 0.2s"></div>
          <div id="bar-3" style="flex:1;height:3px;border-radius:2px;background:var(--border);transition:background 0.2s"></div>
          <div id="bar-4" style="flex:1;height:3px;border-radius:2px;background:var(--border);transition:background 0.2s"></div>
        </div>
        <div id="strength-label" class="form-hint" style="margin-top:4px"></div>
      </div>
      <div class="form-group">
        <label class="form-label">Confirm Password <span class="req">*</span></label>
        <input type="password" id="input-confirm" class="form-input"
          placeholder="Repeat your password" required autocomplete="new-password"/>
        <div id="confirm-error" class="form-error hidden">
          <i class="fas fa-times-circle"></i> Passwords do not match.
        </div>
      </div>

      <div id="error-box" class="danger-box hidden" style="margin-bottom:1rem">
        <i class="fas fa-exclamation-circle"></i>
        <span id="error-text" style="margin-left:6px"></span>
      </div>

      <button type="submit" class="btn btn-primary btn-full btn-lg" id="signup-btn">
        <i class="fas fa-rocket"></i> Create Free Account
      </button>
      <p style="font-size:0.72rem;color:var(--text-4);text-align:center;margin-top:0.75rem;line-height:1.5">
        By signing up you agree to our Terms of Service and Privacy Policy.
      </p>
    </form>

    <div class="auth-divider">or</div>
    <div class="auth-footer">Already have an account? <a href="login.html">Sign in</a></div>
  </div>

  <div id="toast-container"></div>

  <script type="module">
    import {
      auth, db,
      createUserWithEmailAndPassword,
      addDoc, setDoc, doc, collection,
      serverTimestamp, FREE_CREDITS, APP_NAME, showToast
    } from './js/app.js';

    document.getElementById('toggle-password').addEventListener('click', () => {
      const input = document.getElementById('input-password');
      const icon  = document.querySelector('#toggle-password i');
      input.type     = input.type === 'password' ? 'text' : 'password';
      icon.className = input.type === 'password' ? 'fas fa-eye' : 'fas fa-eye-slash';
    });

    document.getElementById('input-password').addEventListener('input', (e) => {
      const val  = e.target.value;
      const bars = [1,2,3,4].map(i => document.getElementById(`bar-${i}`));
      const lbl  = document.getElementById('strength-label');
      let score  = 0;
      if (val.length >= 8)          score++;
      if (/[A-Z]/.test(val))        score++;
      if (/[0-9]/.test(val))        score++;
      if (/[^A-Za-z0-9]/.test(val)) score++;
      const colors = ['','#EF5350','#F59E0B','#3B82F6','#059669'];
      const labels = ['','Weak','Fair','Good','Strong'];
      bars.forEach((b,i) => b.style.background = i < score ? colors[score] : 'var(--border)');
      lbl.textContent = val.length > 0 ? labels[score] : '';
      lbl.style.color = colors[score] || 'var(--text-3)';
    });

    document.getElementById('input-confirm').addEventListener('input', () => {
      const match = document.getElementById('input-password').value ===
                    document.getElementById('input-confirm').value;
      document.getElementById('confirm-error').classList.toggle('hidden',
        match || !document.getElementById('input-confirm').value);
    });

    document.getElementById('signup-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const company  = document.getElementById('input-company').value.trim();
      const name     = document.getElementById('input-name').value.trim();
      const email    = document.getElementById('input-email').value.trim();
      const password = document.getElementById('input-password').value;
      const confirm  = document.getElementById('input-confirm').value;
      const btn      = document.getElementById('signup-btn');
      const errorBox = document.getElementById('error-box');
      const errorTxt = document.getElementById('error-text');

      if (password !== confirm) {
        document.getElementById('confirm-error').classList.remove('hidden'); return;
      }
      errorBox.classList.add('hidden');
      btn.disabled  = true;
      btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Creating account...';

      try {
        // 1. Create Firebase Auth user
        const cred = await createUserWithEmailAndPassword(auth, email, password);
        const uid  = cred.user.uid;

        // 2. Create company doc with AUTO-GENERATED ID (separate from user UID)
        const companyRef = await addDoc(collection(db, 'companies'), {
          name:         company,
          adminEmail:   email,
          adminName:    name,
          plan:         'Free Trial',
          usageCount:   0,
          limit:        FREE_CREDITS,
          logoUrl:      '',
          primaryColor: '#0F172A',
          phone:        '',
          contactEmail: email,
          createdAt:    serverTimestamp()
        });

        // 3. Create user doc — stores companyId pointing to company doc
        await setDoc(doc(db, 'users', uid), {
          email,
          displayName: name,
          role:        'owner',       // owner = first recruiter who created the company
          companyId:   companyRef.id, // ← points to the separate company doc
          companyName: company,
          createdAt:   serverTimestamp()
        });

        showToast(`Welcome to ${APP_NAME}!`, 'success');
        setTimeout(() => { window.location.href = 'recruiter.html'; }, 1000);

      } catch (err) {
        btn.disabled  = false;
        btn.innerHTML = '<i class="fas fa-rocket"></i> Create Free Account';
        errorBox.classList.remove('hidden');
        switch (err.code) {
          case 'auth/email-already-in-use':
            errorTxt.textContent = 'This email is already registered. Try logging in.'; break;
          case 'auth/weak-password':
            errorTxt.textContent = 'Password is too weak. Use at least 8 characters.'; break;
          case 'auth/invalid-email':
            errorTxt.textContent = 'Please enter a valid email address.'; break;
          case 'auth/network-request-failed':
            errorTxt.textContent = 'Network error. Check your connection.'; break;
          default:
            errorTxt.textContent = 'Sign up failed. Please try again.';
            console.error(err);
        }
      }
    });
  </script>
</body>
</html>
